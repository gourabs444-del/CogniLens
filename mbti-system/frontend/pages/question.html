<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CogniLens | Phase Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../pages/Assets/style.css">
</head>
<body>
<main id="app" aria-live="polite">
  <header class="app-header">
    <a class="home-link" href="../../../pages/dashboard/homepage.html">CogniLens</a>
    <div class="phase-pill" id="phase-name">Assessment</div>
  </header>

  <div class="pipeline" id="pipeline"></div>

  <section class="progress-shell">
    <div class="progress-meta">
      <span id="progressText">Question 0 / 0</span>
      <span id="phaseProgressText">No questions</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </section>

  <section class="timer-panel" id="timerPanel" hidden>
    <div class="timer-copy">
      <span>Quick timer</span>
      <strong><span id="timerValue">2</span>s</strong>
    </div>
    <div class="timer-track"><div id="timerFill"></div></div>
  </section>

  <section class="question-card" id="questionCard">
    <div class="question-kicker" id="question-title">Draft</div>
    <h1 id="question-text">No MBTI questions are configured yet.</h1>
    <div id="options" class="options"></div>
    <div class="total-panel" id="totalPanel" hidden>
      <span>Total</span>
      <strong><span id="total">0</span> / 10</strong>
    </div>
    <p class="error" id="error"></p>
  </section>

  <button class="help-button" id="helpButton" type="button">Explain simply</button>
  <div class="explain" id="explainBox"></div>

  <button class="next-button" id="nextButton" type="button">Next</button>
</main>

<section id="phase-screen" class="phase-screen active" aria-modal="true" role="dialog">
  <div id="phase-screen-content">
    <div class="intro-badge">CogniLens Assessment</div>
    <h2 id="phase-big-title">Assessment draft</h2>
    <p id="phase-subtitle">No questions are configured for this assessment yet.</p>
    <div class="phase-overview" id="phaseOverview"></div>
    <button id="phaseStartButton" class="phase-start-button" type="button">Start Phase 1</button>
  </div>
</section>

<script type="module" src="../../../api/submitTest.js"></script>
<script src="../../../score-system.js"></script>
<script src="../../../script.js"></script>
<script src="../js/phases/phase1.js"></script>
<script src="../js/phases/phase2.js"></script>
<script src="../js/phases/phase3.js"></script>
<script src="../js/phases/phase4.js"></script>
<script src="../js/collector.js"></script>
<script src="../js/driver.js"></script>
</body>
</html>
