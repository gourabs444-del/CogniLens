<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>CogniLens | Welcome</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Custom Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'violet-primary': '#7C4DFF',
            'violet-dark': '#311B92',
            'violet-deep': '#1A0E45',
            'violet-light': '#B388FF',
            'star-white': 'rgba(255, 255, 255, 0.8)',
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
</script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
    /* Background gradient */
    .bg-night-sky {
      background: linear-gradient(to bottom, #B388FF 0%, #7C4DFF 30%, #311B92 100%);
      position: relative;
      overflow: hidden;
    }

    /* Moon */
    .moon {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(240,230,255,0.9) 70%, rgba(255,255,255,0) 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px 10px rgba(255, 255, 255, 0.4);
    }

    @media (min-width: 768px) {
      .moon {
        width: 100px;
        height: 100px;
      }
    }
    
    .star-dot {
      position: absolute;
      background-color: white;
      border-radius: 50%;
      opacity: 0.6;
    }

    /* Animated Shooting Stars */
    .animated-shooting-star {
      position: absolute;
      top: 0;
      left: 0;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1), 0 0 0 8px rgba(255, 255, 255, 0.1), 0 0 20px rgba(255, 255, 255, 1);
      animation: shoot 3s linear infinite;
      opacity: 0;
    }

    .animated-shooting-star::before {
      content: '';
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 100px;
      height: 1px;
      background: linear-gradient(90deg, #fff, transparent);
    }

    @keyframes shoot {
      0% {
        transform: rotate(-35deg) translateX(0);
        opacity: 1;
      }
      70% {
        opacity: 1;
      }
      100% {
        transform: rotate(-35deg) translateX(-1000px);
        opacity: 0;
      }
    }

    .star-delay-1 {
      top: 10%;
      left: 80%;
      animation-delay: 0s;
      animation-duration: 4s;
    }

    .star-delay-2 {
      top: 30%;
      left: 90%;
      animation-delay: 5s;
      animation-duration: 3s;
    }

    .star-delay-3 {
      top: 5%;
      left: 50%;
      animation-delay: 12s;
      animation-duration: 5s;
    }

    /* Landscape layers */
    .landscape-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    
    .silhouette-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Apple-style edge lighting effect */
    .apple-glow-button {
      position: relative;
      overflow: visible;
      z-index: 1;
    }
    
    .apple-glow-button::before {
      content: '';
      position: absolute;
      inset: -3px;
      background: linear-gradient(
        90deg,
        #B388FF 0%,
        #ffffff 25%,
        #7C4DFF 50%,
        #ffffff 75%,
        #B388FF 100%
      );
      border-radius: 9999px;
      z-index: -1;
      opacity: 0.7;
      filter: blur(8px);
      animation: edge-glow 3s linear infinite;
      background-size: 200% 100%;
    }
    
    @keyframes edge-glow {
      0% {
        background-position: 0% 0%;
      }
      100% {
        background-position: 200% 0%;
      }
    }
    
    .apple-glow-button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: white;
      border-radius: 9999px;
      z-index: -1;
    }

    /* Animations */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(50px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .animate-fadeInDown {
      animation: fadeInDown 1s ease-out forwards;
    }

    .animate-fadeInUp {
      animation: fadeInUp 1s ease-out forwards;
    }

    .animate-scaleIn {
      animation: scaleIn 0.8s ease-out forwards;
    }

    .animate-slideInLeft {
      animation: slideInLeft 1s ease-out forwards;
    }

    .animate-slideInRight {
      animation: slideInRight 1s ease-out forwards;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }

    .animate-pulse-slow {
      animation: pulse 2s ease-in-out infinite;
    }
    .landing-brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .landing-logo-mark {
      width: 2rem;
      height: 2rem;
      border-radius: 0.65rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 12px 30px rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
    }
</style>
</head>

  </main>

  <!-- Landscape Silhouettes -->
